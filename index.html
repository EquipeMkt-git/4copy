<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#004882" />
<title>4copys — O Canva das copys da 4blue</title>
<meta name="description" content="Gerador interno de copys avançadas por persona, formato e objetivo. 4blue." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Camada de autenticação (login/cadastro). app.js decide o que mostrar. -->
  <div id="auth-root"></div>

  <!-- App principal (escondido até logar) -->
  <div id="app-root" hidden>
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btn-menu" aria-label="Menu">
        <svg class="ic" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <a class="brand" href="#/home">
        <span class="brand-mark">4</span><span class="brand-name">copys</span>
      </a>
      <div class="topbar-search">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="global-search" type="search" placeholder="Buscar projetos, copys, personas…" autocomplete="off" />
      </div>
      <button class="btn btn-primary btn-sm topbar-new" data-nav="#/novo">
        <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span class="only-desktop">Nova copy</span>
      </button>
      <button class="user-chip" id="user-chip" aria-label="Conta">
        <span id="user-initials">4B</span>
      </button>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <nav class="side-nav" id="side-nav"><!-- montado por app.js --></nav>
        <div class="side-foot">
          <div class="ai-badge" id="ai-badge" title="Motor de IA ativo">
            <svg class="ic" viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 1 5 5c0 1.5-.7 2.6-1.5 3.5.9.6 1.5 1.7 1.5 3a4 4 0 0 1-4 4h-1v2M12 2a5 5 0 0 0-5 5c0 1.5.7 2.6 1.5 3.5C7.6 11.1 7 12.2 7 13.5a4 4 0 0 0 4 4"/></svg>
            <span id="ai-badge-text">IA interna</span>
          </div>
        </div>
      </aside>

      <main id="view" class="view"><!-- telas montadas aqui --></main>
    </div>

    <!-- Navegação inferior (mobile) -->
    <nav class="bottom-nav only-mobile" id="bottom-nav"></nav>
  </div>

  <!-- Sobreposições -->
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <!-- Ordem importa: config -> dados -> engine -> store -> auth -> screens -> app -->
  <script src="config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
